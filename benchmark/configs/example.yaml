# 示例配置（与 example.json 语义一致；YAML 需要 pyyaml）
host: 127.0.0.1
port: 8080
server_url: ""            # 为空则由 host:port 推导
model: bench               # llama-server 不校验模型名
ctx_size: 2048             # 需与 llama-server --ctx-size 一致
model_path: ""             # GGUF 模型文件路径（空则从 /props 探测，用于哈希与 metadata）
parallel: 0                # server 并行 slot 数（0 = 探测；与 ctx-size 平分语义相关）
scenario: all              # multi_turn / tool_call / branch / long_life / all
repeat: 1                  # 正式重复次数（1 = 与旧脚本行为一致）
warmup: 0                  # 预热轮数（不计入统计）
seed: 42                   # 确定性种子（temperature=0 下生效）
temperature: 0.0           # 推理温度（正式实验默认 0）
rounds: 20                 # multi_turn 轮数
tool_steps: 6              # tool_call 步数
branch_rounds: 5           # branch 每分支轮数
long_rounds: 40            # long_life 轮数
long_secret: "9527"        # long_life 秘密数字
output_dir: results        # 结果输出目录
report_path: results/bench_report.md   # markdown 报告路径（空则不生成）
enable_thinking: false     # 固定 no-think，保证可比
timings_per_token: false   # 请求 timings_per_token（llama-server 扩展字段）
