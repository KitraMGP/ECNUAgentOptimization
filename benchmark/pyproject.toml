[project]
name = "benchmark"
version = "0.1.0"
description = "Agent 工作流内存/延迟基准测试（面向智能体的内存管理系统赛题）"
authors = [
    { name = "KitraMGP", email = "3056894830@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.53.0",
    "psutil>=7.2.2",
    "nvidia-ml-py>=13.610.43",
]

[project.scripts]
benchmark = "benchmark:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
